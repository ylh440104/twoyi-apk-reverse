name: decompile-twoyi

# Everything runs on GitHub Actions. The only local work is reading the committed text output.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK URL (leave empty to resolve https://twoyi.ai/download)'
        required: false
        default: 'https://twoyi.ai/download'
        type: string

permissions:
  contents: write

concurrency:
  group: decompile-twoyi
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full zstd binutils file zip unzip rsync > /dev/null
          7z | head -3
          zstd --version
          mkdir -p "$RUNNER_TEMP/tools"
          curl -sSL -o "$RUNNER_TEMP/tools/jadx.zip" https://github.com/skylot/jadx/releases/download/v1.5.0/jadx-1.5.0.zip
          unzip -q -o "$RUNNER_TEMP/tools/jadx.zip" -d "$RUNNER_TEMP/tools/jadx"
          chmod +x "$RUNNER_TEMP/tools/jadx/bin/jadx"
          curl -sSL -o "$RUNNER_TEMP/tools/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          "$RUNNER_TEMP/tools/jadx/bin/jadx" --version
          java -jar "$RUNNER_TEMP/tools/apktool.jar" --version

      - name: Download APK
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          URL="${{ inputs.apk_url }}"
          if [ -z "$URL" ]; then URL="https://twoyi.ai/download"; fi
          echo "resolving: $URL"
          FINAL=$(curl -sIL -A 'Mozilla/5.0' "$URL" -o /dev/null -w '%{url_effective}')
          echo "final url: $FINAL"
          echo "$FINAL" > "$RUNNER_TEMP/apk/final_url.txt"
          curl -sSL -A 'Mozilla/5.0' -o "$RUNNER_TEMP/apk/twoyi.apk" "$FINAL"
          ls -l "$RUNNER_TEMP/apk/twoyi.apk"
          sha256sum "$RUNNER_TEMP/apk/twoyi.apk" | tee "$RUNNER_TEMP/apk/sha256.txt"
          file "$RUNNER_TEMP/apk/twoyi.apk"

      - name: APK structure
        run: |
          set -uo pipefail
          mkdir -p report/apk
          APK="$RUNNER_TEMP/apk/twoyi.apk"
          unzip -l "$APK" > report/apk/entries.txt 2>&1 || true
          unzip -l "$APK" | awk '{print $4}' | grep -c . > report/apk/entry_count.txt || true
          {
            echo "# APK summary"
            echo
            echo "- source: $(cat "$RUNNER_TEMP/apk/final_url.txt")"
            echo "- sha256: $(cut -d' ' -f1 "$RUNNER_TEMP/apk/sha256.txt")"
            echo "- size: $(stat -c%s "$APK") bytes"
            echo
            echo "## dex"
            unzip -l "$APK" | grep -E '\.dex$' || true
            echo
            echo "## native libs"
            unzip -l "$APK" | grep -E 'lib/.*\.so$' || true
            echo
            echo "## assets"
            unzip -l "$APK" | grep -E ' assets/' || true
            echo
            echo "## top 40 largest entries"
            unzip -l "$APK" | sort -k1 -n -r | head -47 || true
          } > report/apk/summary.md

      - name: Decode resources and manifest (apktool)
        run: |
          set -uo pipefail
          java -jar "$RUNNER_TEMP/tools/apktool.jar" d -f --no-src \
            -o "$RUNNER_TEMP/apktool-out" "$RUNNER_TEMP/apk/twoyi.apk" || true
          if [ -d "$RUNNER_TEMP/apktool-out" ]; then
            mkdir -p report/apktool
            cp -f "$RUNNER_TEMP/apktool-out/AndroidManifest.xml" report/apktool/ 2>/dev/null || true
            cp -f "$RUNNER_TEMP/apktool-out/apktool.yml" report/apktool/ 2>/dev/null || true
            find "$RUNNER_TEMP/apktool-out/res" -type f 2>/dev/null | sed "s|$RUNNER_TEMP/apktool-out/||" | sort > report/apktool/res-files.txt || true
            # pull the interesting string resources only
            for d in "$RUNNER_TEMP"/apktool-out/res/values*; do
              [ -d "$d" ] || continue
              n=$(basename "$d")
              mkdir -p "report/apktool/res/$n"
              cp -f "$d"/*.xml "report/apktool/res/$n/" 2>/dev/null || true
            done
          fi

      - name: Decompile java (jadx)
        run: |
          set -uo pipefail
          "$RUNNER_TEMP/tools/jadx/bin/jadx" --no-res --deobf -j 4 \
            -d "$RUNNER_TEMP/jadx-out" "$RUNNER_TEMP/apk/twoyi.apk" > "$RUNNER_TEMP/jadx.log" 2>&1 || true
          tail -20 "$RUNNER_TEMP/jadx.log" || true
          mkdir -p report/jadx
          cp -f "$RUNNER_TEMP/jadx.log" report/jadx/jadx.log || true
          find "$RUNNER_TEMP/jadx-out" -maxdepth 2 -type d | sed "s|$RUNNER_TEMP/jadx-out|jadx-out|" | sort | head -100 > report/jadx/tree.txt || true
          # Discover the app's own packages (the name may differ between releases)
          SRC="$RUNNER_TEMP/jadx-out/sources"
          ls "$SRC" > report/jadx/top-level-packages.txt 2>/dev/null || true
          find "$SRC" -maxdepth 3 -type d | sed "s|$SRC/||" | sort > report/jadx/packages.txt || true
          # keep only the vendor packages: anything with "twoyi" in the path
          mkdir -p decompiled/sources
          find "$SRC" -maxdepth 3 -type d -iname '*twoyi*' -print0 2>/dev/null \
            | while IFS= read -r -d '' d; do
                rel="${d#$SRC/}"
                mkdir -p "decompiled/sources/$(dirname "$rel")"
                rsync -a "$d" "decompiled/sources/$(dirname "$rel")/" || true
              done
          find decompiled -name '*.java' | wc -l > report/jadx/committed-java-count.txt || true
          du -sh decompiled >> report/jadx/committed-java-count.txt || true

      - name: Native libraries
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/libs" report/native
          unzip -o -j "$RUNNER_TEMP/apk/twoyi.apk" 'lib/*/*.so' -d "$RUNNER_TEMP/libs" > /dev/null 2>&1 || true
          for f in "$RUNNER_TEMP"/libs/*.so; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            {
              echo "### $n  ($(stat -c%s "$f") bytes)"
              file "$f"
              readelf -d "$f" 2>/dev/null | grep -E 'NEEDED|SONAME' || true
              echo "-- exported symbols --"
              nm -D --defined-only "$f" 2>/dev/null | awk '{print $3}' | sed 's/@.*//' | sort -u || true
              echo
            } >> report/native/symbols.txt
            strings -a -n 5 "$f" | sort -u > "report/native/strings-$n.txt" || true
          done
          ls -l report/native | head -20

      - name: Inspect internal ROM (rootfs)
        run: |
          set -u
          APK="$RUNNER_TEMP/apk/twoyi.apk"
          mkdir -p "$RUNNER_TEMP/rootfs" report/rootfs
          unzip -l "$APK" | awk '{print $4}' | grep -Ei '^assets/.*\.(7z|zip|xz|tar|zst|tar\.zst|tar\.gz|tgz)$' | sort -u > report/rootfs/blobs.txt || true
          echo "--- candidate ROM blobs ---"
          cat report/rootfs/blobs.txt || true

          extract_blob() {   # $1 = blob path
            local blob="$1" name out
            name=$(basename "$blob")
            case "$name" in
              *.tar.zst|*.tzst)
                zstd -dc "$blob" 2>/dev/null | tar -tf - > "$RUNNER_TEMP/listing.full" 2>/dev/null || true
                zstd -dc "$blob" 2>/dev/null | tar -tf - 2>/dev/null | wc -l > "$RUNNER_TEMP/listing.count" || echo 0 > "$RUNNER_TEMP/listing.count"
                ;;
              *)
                7z l "$blob" > "$RUNNER_TEMP/listing.full" 2>/dev/null || true
                wc -l < "$RUNNER_TEMP/listing.full" > "$RUNNER_TEMP/listing.count" 2>/dev/null || echo 0 > "$RUNNER_TEMP/listing.count"
                ;;
            esac
            {
              echo "# listing of $name"
              echo
              echo "total lines: $(cat "$RUNNER_TEMP/listing.count" 2>/dev/null || echo 0)"
              echo
              head -3000 "$RUNNER_TEMP/listing.full" 2>/dev/null || true
            } > "report/rootfs/listing-$name.txt"
            tail -30 "report/rootfs/listing-$name.txt" || true

            # guest top-level layout -> compact summary we can read locally
            awk '{print $NF}' "$RUNNER_TEMP/listing.full" 2>/dev/null \
              | sed 's|^\./||' | awk -F/ 'NF>1{print $1"/"$2} NF==1{print $1}' \
              | sort | uniq -c | sort -rn | head -60 > "report/rootfs/top-dirs-$name.txt" || true

            # only tiny text metadata is extracted; never the whole system
            mkdir -p "$RUNNER_TEMP/rootfs/meta"
            case "$name" in
              *.tar.zst|*.tzst)
                zstd -dc "$blob" 2>/dev/null | tar -xf - -C "$RUNNER_TEMP/rootfs/meta" \
                  --wildcards '*/rom.ini' '*/init' '*/init.rc' '*/init.environ.rc' \
                  '*/prop.default' '*/default.prop' '*/build.prop' '*/system/build.prop' \
                  '*/vendor/build.prop' '*/vendor/default.prop' '*/odm/etc/*' \
                  '*/system/etc/init/*' '*/system/etc/ld.config*' '*/system/etc/vintf/*' \
                  '*/system/etc/permissions/*' '*/system/etc/public.libraries*' \
                  '*.rc' 2>/dev/null || true
                zstd -dc "$blob" 2>/dev/null | tar -xf - -C "$RUNNER_TEMP/rootfs/meta" \
                  --wildcards '*libEGL*' '*libGLES*' '*hw/*' '*libtwoyi*' '*libOpenglRender*' \
                  '*libloader*' '*twoyi*' 2>/dev/null || true
                ;;
              *)
                7z x -y -o"$RUNNER_TEMP/rootfs/meta" "$blob" \
                  '*rom.ini' '*init' '*init.rc' '*init.environ.rc' \
                  '*prop.default' '*default.prop' '*build.prop' '*libEGL*' '*libGLES*' \
                  '*hw/*' '*twoyi*' '*libloader*' > /dev/null 2>&1 || true
                ;;
            esac
          }

          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            echo "== $entry"
            unzip -o -j "$APK" "$entry" -d "$RUNNER_TEMP/rootfs" > /dev/null 2>&1 || true
            blob="$RUNNER_TEMP/rootfs/$(basename "$entry")"
            [ -f "$blob" ] || continue
            echo "   size: $(stat -c%s "$blob")"
            extract_blob "$blob"
          done < report/rootfs/blobs.txt

          echo "--- extracted metadata ---"
          find "$RUNNER_TEMP/rootfs/meta" -type f 2>/dev/null | sed "s|$RUNNER_TEMP/rootfs/meta/||" | head -200 || true

          # commit the extracted text files (rc / prop / ini), preserving paths
          if [ -d "$RUNNER_TEMP/rootfs/meta" ]; then
            rsync -a \
              --include='*/' \
              --include='*.rc' --include='*.prop' --include='*.ini' \
              --include='*.conf' --include='*.xml' --include='*.txt' \
              --exclude='*' \
              "$RUNNER_TEMP/rootfs/meta/" report/rootfs/meta-text/ 2>/dev/null || true
            mkdir -p report/rootfs/stub-strings
            find "$RUNNER_TEMP/rootfs/meta" -type f \( -name '*.so' -o -perm -u+x \) 2>/dev/null | head -60 | while IFS= read -r so; do
              strings -a -n 6 "$so" 2>/dev/null | sort -u > "report/rootfs/stub-strings/$(basename "$so").txt" || true
            done
          fi
          du -sh report/rootfs || true
          exit 0

      - name: Keyword index (cheap local reading)
        run: |
          set -u
          mkdir -p report/keywords
          PAT='TWOYI_SOCK|TYLOADER|loader64|rootfs\.tar|rootfs\.7z|libloader|libtwoyi|OpenglRender|opengles|dev/input|TaskCommander|getRelay|twoyiSocket|guest|HostDisplay|crossProfile|phantom|vmx|kvm|libsu|KernelSU|Magisk'
          for f in report/native/strings-*.txt report/rootfs/stub-strings/*.txt; do
            [ -f "$f" ] || continue
            n=$(basename "$f")
            grep -E "$PAT" "$f" 2>/dev/null | sort -u > "report/keywords/hits-$n" || true
          done
          {
            echo "# Java/JSON-ish hits in decompiled sources"
            echo
            grep -rInE "$PAT" decompiled/sources 2>/dev/null | head -600 || true
          } > report/keywords/hits-sources.txt
          {
            echo "# string resources of interest"
            echo
            grep -nE 'twoyi|rom|rootfs|guest|phantom|shizuku|kernelsu|xposed|magisk|adb|vpn|stat' \
              report/apktool/res/values/strings.xml 2>/dev/null | head -300 || true
          } > report/keywords/hits-strings-res.xml
          wc -l report/keywords/* | tail -20 || true
          exit 0

      - name: Commit results
        run: |
          set -uo pipefail
          git config user.name "twoyi-reverse-bot"
          git config user.email "actions@users.noreply.github.com"
          cat > README.md <<'EOF'
          # twoyi-apk-reverse

          Automated reverse-engineering dump of the **latest public Twoyi Android APK**
          (`https://twoyi.app/android/` -> `https://twoyi.ai/download`).

          Everything here is produced by `.github/workflows/decompile.yml` on GitHub-hosted runners.

          * `report/apk/`        - APK entry list, sha256, dex/native/asset inventory
          * `report/apktool/`    - decoded AndroidManifest.xml + decoded value resources
          * `report/jadx/`       - jadx log and package tree
          * `report/native/`     - ELF headers, exported symbols and strings of the packaged `.so` files
          * `report/rootfs/`     - listing of the bundled internal-Android 7z, plus the boot scripts/props
                                   and strings of the guest-side HAL/EGL stubs it contains
          * `decompiled/sources/`- jadx Java output for the app's own packages (`io.twoyi.*`)

          No APK and no music/asset binaries are redistributed; only text extracted from them.
          Upstream project: https://github.com/twoyi/twoyi (MPL-2.0). For study and interoperability.
          EOF
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "decompile $(cat "$RUNNER_TEMP/apk/final_url.txt") [skip ci]"
            git push origin HEAD
          fi

      - name: Upload full dump as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twoyi-dump
          if-no-files-found: warn
          retention-days: 14
          path: |
            report
            decompiled
            ${{ runner.temp }}/jadx.log
